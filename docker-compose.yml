version: "3.8"

services:
  taskboard-api:
    build: .
    container_name: taskboard-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/taskboard.sqlite
      - CORS_ORIGIN=*
      # JWT_SECRET should be set via .env file or docker secrets
    env_file:
      - .env.production
    volumes:
      - taskboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  taskboard-data:
    driver: local

networks:
  default:
    name: taskboard-network
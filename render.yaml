# Render.com Blueprint - Free Tier
# Deploy: git push + connect repo on render.com

services:
  - type: web
    name: taskboard-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@taskboard.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data/taskboard.sqlite